<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard-sitter" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="notification-content" fullscreen>
  <ion-list>
    <ion-item *ngFor="let notification of notifications">
      <ion-avatar slot="start">
        <img [src]="notification.ownerPhoto" [alt]="notification.ownerName" />
      </ion-avatar>
      <ion-label>
        <h3>{{ notification.ownerName }}</h3>
        <p>{{ notification.message }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
