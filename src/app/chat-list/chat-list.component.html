<ion-header class="custom-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Conversations</ion-title>
    <ion-buttons slot="end">
      <!-- Ensure 'notifications-outline' icon is available or use a different one -->
      <ion-icon name="notifications-outline" class="notif-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content">
  <ion-list *ngIf="!loading && threads && threads.length > 0">
    <ion-item
      *ngFor="let th of threads"
      button
      [routerLink]="['/chat', th.id]"
      lines="full"
    >
      <ion-avatar slot="start">
        <img
          [src]="th.otherParticipant?.profilePictureURL || '/assets/default-avatar.png'"
          [alt]="th.otherParticipant?.first_name"
        />
      </ion-avatar>

      <ion-label>
        <h3>
          {{ th.otherParticipant?.first_name }}
          {{ th.otherParticipant?.last_name }}
        </h3>
        <p *ngIf="th.messages && th.messages.length > 0">{{ th.messages[0]?.body }}</p>
        <p *ngIf="!th.messages || th.messages.length === 0">No messages yet</p>
      </ion-label>

      <ion-note slot="end" class="timestamp" *ngIf="th.messages && th.messages.length > 0">
        {{ th.messages[0]?.created_at | date:'HH:mm' }}
      </ion-note>

      <ion-badge
        *ngIf="th.unreadCount > 0"
        slot="end"
        class="unread-badge"
      >
        {{ th.unreadCount }}
      </ion-badge>
    </ion-item>
  </ion-list>
  <div *ngIf="loading" style="text-align: center; padding: 20px;">
    Loading conversations...
  </div>
  <div *ngIf="!loading && (!threads || threads.length === 0)" style="text-align: center; padding: 20px;">
    No conversations found.
  </div>
</ion-content>
