<ion-header class="custom-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Conversations</ion-title>
    <ion-buttons slot="end">
      <ion-icon name="notifications-outline" class="notif-icon"></ion-icon>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content">
  <ion-list>
    <ion-item
      *ngFor="let th of threads"
      button
      [routerLink]="['/chat', th.id]"
      lines="full"
    >
      <ion-avatar slot="start">
        <!-- otherParticipant is non-optional, so no need for ?. -->
        <img
          [src]="
            th.otherParticipant.profilePictureURL ||
            '/assets/default-avatar.png'
          "
          alt="{{ th.otherParticipant.first_name }}"
        />
      </ion-avatar>

      <ion-label>
        <h3>
          {{ th.otherParticipant.first_name }}
          {{ th.otherParticipant.last_name }}
        </h3>
        <!-- messages[0] is assumed to always exist -->
        <p>{{ th.messages[0].body }}</p>
      </ion-label>

      <ion-note slot="end" class="timestamp">
        {{ th.messages[0].created_at | date:'HH:mm' }}
      </ion-note>

      <ion-badge
        *ngIf="th.unreadCount > 0"
        slot="end"
        class="unread-badge"
      >
        {{ th.unreadCount }}
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
